<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knew you would say yes!</title>
    <link rel="stylesheet" href="yes_style.css">
</head>
<body>
    <div class="container">
        <h1 class="header_text">Knew you would say yes! 💘</h1>

        <p class="message_text">
            My love,<br><br>
            Thank you for always being my safe place, my happiness, and my biggest blessing.
            Thank you for your patience, your love, and for choosing me every single day.
            I’m so grateful for you today and always 💖
        </p>

        <div class="gif_container">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3ZGN6NHhhaDE2Mjg1ZjkwOXczdDFxbWM3dTBtaW9zaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/9XY4f3FgFTT4QlaYqa/giphy.gif" alt="Love GIF">
        </div>
    </div>

    <script>
        setInterval(() => {
            const heart = document.createElement("div");
            heart.innerHTML = "💖";
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }, 600);
    </script>
</body>
</html>
